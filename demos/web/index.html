<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>Sopro ONNX</title>
    <link rel="stylesheet" href="style.css" />
    <script src="coi.js"></script>
    <script type="importmap">
      {
        "imports": {
          "@soprotts/onnx-web": "https://cdn.jsdelivr.net/npm/@soprotts/onnx-web@0.2.1/src/index.js",
          "onnxruntime-web/wasm": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort.wasm.bundle.min.mjs",
          "onnxruntime-web/webgpu": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort.webgpu.bundle.min.mjs"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <header>
        <div class="brand"><h1>Sopro</h1><p id="runtime-description">Local voice synthesis</p></div>
        <nav class="project-links" aria-label="Project links">
          <a href="https://github.com/samuel-vitorino/sopro" target="_blank" rel="noreferrer" aria-label="Sopro on GitHub" title="GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.4c.58.1.79-.25.79-.56v-2.22c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.3-5.27-1.29-5.27-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.96 10.96 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.06.79 2.14v3.05c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z" /></svg>
          </a>
          <a id="model-link" href="https://huggingface.co/samuel-vitorino/sopro-v2-turbo-onnx" target="_blank" rel="noreferrer" aria-label="Sopro model on Hugging Face" title="Hugging Face"><img src="assets/huggingface.svg" alt="" /></a>
        </nav>
      </header>

      <section id="model-loader" class="model-loader" aria-live="polite" hidden>
        <div class="loader-content">
          <div class="loader-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <strong id="model-loader-title">Loading model</strong>
          <span id="model-status">Preparing local runtime…</span>
          <div class="model-progress"><i id="model-progress"></i></div>
        </div>
      </section>

      <div id="app" hidden>
        <section id="drop" class="drop">
          <input id="reference" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac,.flac,.ogg,.opus" hidden />
          <div class="reference-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="reference-copy"><strong id="reference-name">Drop a voice reference</strong><span>Choose a file or record 5-20 seconds</span></div>
          <div class="reference-actions">
            <button id="record" type="button" aria-label="Record a voice reference" title="Record with microphone">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.2a2.8 2.8 0 0 0 2.8-2.8V4.3a2.8 2.8 0 1 0-5.6 0v3.1A2.8 2.8 0 0 0 8 10.2Zm4.4-3.1a.7.7 0 0 1 .7.7A5.1 5.1 0 0 1 8.7 13v1.1h1.8a.7.7 0 1 1 0 1.4h-5a.7.7 0 1 1 0-1.4h1.8V13a5.1 5.1 0 0 1-4.4-5.2.7.7 0 1 1 1.4 0 3.7 3.7 0 1 0 7.4 0 .7.7 0 0 1 .7-.7Z" /></svg>
              <span id="record-label">Record</span>
            </button>
            <button id="choose" type="button">Choose</button>
          </div>
        </section>

        <section class="card compose">
          <label for="text">Text to speak</label>
          <textarea id="text" rows="3">The smallest voice can still fill a room.</textarea>
          <div class="toolbar">
            <div class="segmented" aria-label="Synthesis mode">
              <button class="active" data-mode="stream" type="button">Stream</button>
              <button data-mode="offline" type="button">Offline</button>
            </div>
            <div class="toolbar-actions">
              <label id="backend-control" class="select-toggle backend-toggle" title="Backend" hidden>
                <span class="sr-only">Backend</span>
                <select id="backend" aria-label="Backend"></select>
              </label>
              <label class="select-toggle language-toggle" title="Language">
                <span class="sr-only">Language</span>
                <select id="language" aria-label="Language"><option value="" selected>Auto</option><option value="en">EN</option><option value="pt">PT</option><option value="fr">FR</option><option value="de">DE</option></select>
              </label>
              <button id="speak" class="primary" type="button" disabled><span>Speak</span><kbd>↵</kbd></button>
            </div>
          </div>
        </section>

        <details class="card settings">
          <summary>Voice controls <span>sampling</span></summary>
          <div class="grid">
            <label>Temperature<output id="temperature-value">0.80</output><input id="temperature" type="range" min="0" max="1.5" step="0.05" value="0.8" /></label>
            <label>Top P<output id="top-p-value">0.90</output><input id="top-p" type="range" min="0.1" max="1" step="0.05" value="0.9" /></label>
            <label>Top K<input id="top-k" type="number" min="0" max="100" value="25" /></label>
            <label>Seed<input id="seed" type="number" min="0" value="1" /></label>
          </div>
        </details>

        <section class="output card">
          <div class="status-row"><span id="status">Add a reference to begin.</span><span id="timing"></span></div>
          <div class="progress"><i id="progress"></i></div>
          <div id="player" class="audio-player" hidden>
            <button id="play" class="play" type="button" aria-label="Play audio">
              <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="m5 3 8 5-8 5V3Z" /></svg>
              <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h3v10H4V3Zm5 0h3v10H9V3Z" /></svg>
            </button>
            <button id="wave-track" class="wave-track" type="button" aria-label="Seek through audio"><canvas id="waveform"></canvas></button>
            <span id="audio-time" class="audio-time">0:00 / 0:00</span>
            <a id="download" download="sopro.wav" aria-label="Download WAV" title="Download WAV">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7.3 2h1.4v7.1l2.2-2.2 1 1L8 11.8 4.1 7.9l1-1 2.2 2.2V2ZM3 12h10v2H3v-2Z" /></svg>
            </a>
          </div>
          <audio id="audio" preload="metadata" hidden></audio>
        </section>
      </div>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
